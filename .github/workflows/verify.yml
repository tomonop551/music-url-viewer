name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node / pnpm (from mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ローカルと同じ検証入口（mise タスク）で揃える。実行順は `mise run ci` と同じ。
      - name: Lint
        run: mise run lint

      - name: Type check
        run: mise run type-check

      - name: Format check
        run: mise run format:check

      - name: Unit tests
        run: mise run test:unit

      - name: Build
        run: mise run build

      # Storybook のブラウザテストは chromium と OS の共有ライブラリを要す。
      # 導入コマンドは mise.toml の `e2e:setup` をそのまま呼び、ローカル手順との二重管理を避ける。
      # ブラウザバイナリのみ pnpm-lock.yaml のハッシュでキャッシュする。OS 依存パッケージは
      # ランナーは毎回新しいので e2e:setup を毎回通す（キャッシュヒット時はダウンロードだけが短縮される）。
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: mise run e2e:setup

      - name: Storybook browser tests
        run: mise run test:storybook
