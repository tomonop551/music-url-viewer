# music-url-viewer — Cloudflare IaC（単一ソース: wrangler.toml）
#
# 設計方針は issue #1 のIaC技術選定コメントを参照。
# 実シークレットは git に入れず `wrangler secret put <NAME>` で設定する。
#
# 注意: これは IaC 選定のスキャフォールド。OpenNext アダプタの成果物パス（main）と
# 最終バインディング名は、実環境で `wrangler dev` 検証後に確定する。

name = "music-url-viewer"

# OpenNext が生成する Worker bundle。アダプタ版数ごとに変わるため実検証で確定する
# （例: .open-next/worker.js）
main = ".open-next/worker.js"

compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]  # OpenNext が Node 互換 API を要するため必須

# dev/preview は wrangler dev が利用。本番 URL により production 用の [env.*] を切る方針。
# （テーブル宣言より前に置くこと。後ろに書くと [assets] のキーとして扱われる）
workers_dev = true

# OpenNext が生成した静的アセット（/_next/static/* の JS・CSS）を配信するための設定。
# これが無いと Worker は HTML だけを返し、CSS・JS が 404 になって無装飾の画面になる。
# binding 名 ASSETS は OpenNext が env.ASSETS として参照するため固定。
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ---- アプリ実行時 変数 ----
# 旧 `CHAT_TABLE_NAME`/`AGENTCORE_RUNTIME_ARN` は Cloudflare へ移行後不要になる
# （D1/KV バインディングに置換）。残る変数をここへ集約する。
[vars]
APP_ORIGIN = "https://music-url-viewer.tomods1203.workers.dev"
MUSICBRAINZ_USER_AGENT = "music-url-viewer/0.1 (+https://github.com/tomonop551/music-url-viewer)"

# ---- Basic 認証（src/proxy.ts）----
# 平文シークレットは git に入れない。デプロイ時に `wrangler secret put` で設定する:
#   wrangler secret put BASIC_AUTH_USER
#   wrangler secret put BASIC_AUTH_PASSWORD
# 未設定の場合は認証ゲートが無効（素通し）になる。

# ---- D1: 音楽カタログ（旧: DynamoDB `MusicUrls` / `-features` / `-chat` の一部）----
# features / chat_session / chat_budget の各テーブルはコード上の参照を削除済み。
# テーブル自体は将来の enrichment や再実装に備えて D1 側に残してある。
# catalog の行検証は message_id で結合するため、単一 DB に同居させる。
# ID は `wrangler d1 create music_url_viewer` で埋める。
[[d1_databases]]
binding = "DB"
database_name = "music_url_viewer"
database_id = "426235b5-c53e-4b59-b226-9242e7d28e18"

# ---- 定期取り込み（旧 Lambda + EventBridge rate(15min)）----
# 濃縮は 1 日 1 回に実施（旧 15 分間隔）。Catalog ≤300 前提なら日次で十分。
# Worker に scheduled ハンドラを持つ場合に有効化する。日次化で追いつかないよう、
# 1 実行あたりの処理件数上限（旧: 25 件）は catalog 規模に合わせて引き上げること。
# コミット時点ではコメントアウト（メイン Worker への組み込み可否を検証してから）
# [triggers]
# crons = ["0 0 * * *"]
