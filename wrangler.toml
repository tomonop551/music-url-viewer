# music-url-viewer — Cloudflare IaC（単一ソース: wrangler.toml）
#
# 設計方針は issue #1 のIaC技術選定コメントを参照。
# アカウント層（D1 DB・KV namespace の作成）は scripts/setup-cloudflare.sh で初期化し、
# 返却される ID を下のプレースホルダに埋める。実シークレットは git に入れず
# `wrangler secret put <NAME>` で設定する。
#
# 注意: これは IaC 選定のスキャフォールド。OpenNext アダプタの成果物パス（main）と
# 最終バインディング名は、実環境で `wrangler dev` 検証後に確定する。

name = "music-url-viewer"

# OpenNext が生成する Worker bundle。アダプタ版数ごとに変わるため実検証で確定する
# （例: .open-next/worker.js）
main = ".open-next/worker.js"

compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]  # OpenNext が Node 互換 API を要するため必須

# dev/preview は wrangler dev が利用。本番 URL により production 用の [env.*] を切る方針。
workers_dev = true

# ---- アプリ実行時 変数 ----
# 旧 `CHAT_TABLE_NAME`/`AGENTCORE_RUNTIME_ARN` は Cloudflare へ移行後不要になる
# （D1/KV/Workers AI バインディングに置換）。残る変数をここへ集約する。
[vars]
APP_ORIGIN = "https://example.com"        # TODO: 実ドメイン確定後に設定
CHAT_DAILY_LIMIT = "200"                  # 既存 .env のデフォルト（日次枠）
MUSICBRAINZ_USER_AGENT = "music-url-viewer/0.1 (+https://github.com/tomonop551/music-url-viewer)"

# ---- D1: 音楽カタログ（旧 DynamoDB `MusicUrls`）----
# ID は `wrangler d1 create music_catalog` の結果を埋める（setup スクリプトが自動反映）
[[d1_databases]]
binding = "DB_CATALOG"
database_name = "music_catalog"
database_id = "{DB_CATALOG_ID}"

# ---- D1: 特徴量・嗜好性スコア（旧 `${name}-features`）----
[[d1_databases]]
binding = "DB_FEATURES"
database_name = "music_features"
database_id = "{DB_FEATURES_ID}"

# ---- KV: チャット会話・日次枠・key-value（旧 `${name}-chat`）----
# expiresIn / expiresAt で TTL 相当を付与できるため、D1 より自然に管理できる
[[kv_namespaces]]
binding = "CHAT_KV"
id = "{CHAT_KV_ID}"

# ---- Workers AI ----
# バインディングは `env.AI`（組み込み名）。旧 Bedrock 呼び出しを
# `@cloudflare/ai-utils`（runWithTools）へ移植して使う。

# ---- 定期取り込み（旧 Lambda + EventBridge rate(15min)）----
# Worker に scheduled ハンドラを持つ場合に有効化する（min 間隔 1 分）
# コミット時点ではコメントアウト（メイン Worker への組み込み可否を検証してから）
# [triggers]
# crons = ["*/15 * * * *"]